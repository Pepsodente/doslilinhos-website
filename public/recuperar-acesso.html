<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acesso</title><link rel="stylesheet" href="/auth-recovery.css?v=1"></head><body><main class="page"><section class="card"><p class="eyebrow">Área de cliente</p><h1>Recuperar acesso</h1><p>Introduz o email ou o nome de utilizador associado à conta.</p><form id="recover"><label>Email ou nome de utilizador<input name="identifier" required autocomplete="username"></label><button class="button">Enviar instruções</button><p id="message" class="message" role="status"></p></form><p class="links"><a href="/?login=1">Voltar a entrar</a></p></section></main><script>document.querySelector('#recover').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),m=document.querySelector('#message');b.disabled=true;m.textContent='A enviar...';try{const r=await fetch('/api/auth/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:new FormData(f).get('identifier')})}),d=await r.json();m.textContent=d.message||'Se encontrarmos uma conta correspondente, enviaremos um email com as instruções.';f.reset()}catch{x=>0;m.textContent='Não foi possível concluir agora. Tenta novamente.'}finally{b.disabled=false}}</script></body></html>
