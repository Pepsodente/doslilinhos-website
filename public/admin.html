<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reservas | Dos Lilinhos</title>
  <style>
    :root{--g:#193f2d;--c:#f7f2e6;--w:#fff;--r:#a83333;--line:#d8ded9}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#17231c;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--g);color:#fff;padding:22px max(4vw,20px);display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font:700 28px Georgia,serif}main{max-width:1180px;margin:auto;padding:35px 20px}.login,.panel{background:#fff;border-radius:18px;padding:25px;box-shadow:0 12px 40px #183c2917}.login{max-width:520px;margin:9vh auto}.login h2{font:700 34px Georgia,serif;margin:0 0 10px}label{font-weight:750}input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:99px;padding:10px 16px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e8eee9;color:var(--g)}.btn.danger{background:var(--r)}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;padding:12px 16px;border-radius:12px}.list{display:grid;gap:12px}.card{background:#fff;border-radius:15px;padding:18px;display:grid;grid-template-columns:1.2fr 1fr auto;gap:16px;align-items:center;border-left:7px solid #d1a348}.card.confirmed{border-color:#3b7f59}.card.completed{border-color:#758078}.card.cancelled{border-color:#a83333;opacity:.72}.card h3{margin:0 0 5px;font:700 20px Georgia,serif}.meta{color:#5a675f;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.hidden{display:none!important}.message{padding:12px;border-radius:10px;background:#eef4ef;margin-bottom:14px}@media(max-width:760px){.card{grid-template-columns:1fr}.actions{justify-content:flex-start}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><h1>Dos Lilinhos | Reservas</h1><button id="logout" class="btn secondary hidden">Sair</button></header>
<main>
  <section id="login" class="login">
    <h2>Área administrativa</h2>
    <p>Introduz o código administrativo configurado na Cloudflare.</p>
    <form id="login-form"><label>Código administrativo<input id="token" type="password" required autocomplete="current-password"></label><button class="btn">Entrar</button></form>
  </section>
  <section id="dashboard" class="hidden">
    <div id="message" class="message hidden"></div>
    <div class="toolbar"><div class="stats"><div class="stat"><b id="pending-count">0</b> pendentes</div><div class="stat"><b id="confirmed-count">0</b> confirmadas</div></div><button id="refresh" class="btn secondary">Atualizar</button></div>
    <div id="reservations" class="list"></div>
  </section>
</main>
<script src="admin.js?v=1"></script>
</body>
</html>
