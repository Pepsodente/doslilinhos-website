<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Gestão | Dos Lilinhos</title>

  <style>
    :root {
      --green: #174d36;
      --green2: #7fc36d;
      --coral: #ed4d5a;
      --ink: #26312a;
      --muted: #6b756f;
      --line: #dfe5e1;
      --soft: #f5f7f5;
      --white: #ffffff;
      --warn: #d78b19;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font: 15px/1.45 Inter, system-ui, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 28px;
      border-top: 8px solid var(--green2);
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header small {
      display: block;
      color: var(--muted);
    }

    main {
      max-width: 1450px;
      margin: auto;
      padding: 24px;
    }

    .hidden {
      display: none !important;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--white);
    }

    .login {
      max-width: 460px;
      margin: 70px auto;
    }

    .login input {
      width: 100%;
      margin: 8px 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(0.95);
    }

    .btn.secondary {
      background: #e8eeea;
      color: var(--green);
    }

    .btn.danger {
      background: var(--danger);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary button {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      text-align: left;
      cursor: pointer;
    }

    .summary button.active {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(23, 77, 54, 0.13);
    }

    .summary strong {
      display: block;
      font-size: 27px;
    }

    .summary span {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      background: var(--green);
      color: var(--white);
    }

    .search {
      flex: 1;
      min-width: 210px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    select {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--white);
    }

    table {
      width: 100%;
      min-width: 1040px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f0f4f1;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    tr:hover td {
      background: #fafcfb;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e8eeea;
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
    }

    .badge.warn {
      background: #fff1d9;
      color: #8a5700;
    }

    .badge.paid {
      background: #e2f5e5;
      color: #176329;
    }

    .badge.danger {
      background: #fee8e6;
      color: #971d15;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .actions .btn {
      padding: 8px 10px;
      font-size: 12px;
    }

    .message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      max-width: calc(100vw - 40px);
      padding: 13px 17px;
      border-radius: 9px;
      background: #222222;
      color: var(--white);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
    }

    .empty {
      padding: 50px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      width: min(94vw, 520px);
      padding: 25px;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.33);
    }

    dialog::backdrop {
      background: rgba(7, 24, 16, 0.66);
    }

    dialog label {
      display: block;
      margin: 12px 0;
      font-weight: 750;
    }

    dialog input,
    dialog textarea,
    dialog select {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    dialog textarea {
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .at-reference-preview {
      display: block;
      max-width: 270px;
      margin-top: 7px;
      padding: 6px 8px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--green);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.35;
    }

    .copy-at-reference.copied {
      background: #55795c;
      color: var(--white);
    }

    @media (max-width: 900px) {
      main {
        padding: 14px;
      }

      header {
        padding: 14px;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        align-items: stretch;
      }

      .search {
        width: 100%;
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Gestão Dos Lilinhos</h1>
      <small>Pedidos, pagamentos e subscrições</small>
    </div>

    <div class="top-actions">
      <button
        id="refresh"
        class="btn secondary"
        type="button"
      >
        Atualizar
      </button>

      <button
        id="logout"
        class="btn danger hidden"
        type="button"
      >
        Sair
      </button>
    </div>
  </header>

  <main>
    <section id="login" class="panel login">
      <h2>Área administrativa</h2>

      <form id="login-form">
        <label>
          Código administrativo

          <input
            id="token"
            type="password"
            required
            autofocus
            autocomplete="current-password"
          >
        </label>

        <button class="btn">
          Entrar
        </button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="summary">
        <button type="button" data-summary="all" class="active">
          <strong id="s-all">0</strong>
          <span>Total</span>
        </button>

        <button type="button" data-summary="pending">
          <strong id="s-pending">0</strong>
          <span>Por aprovar</span>
        </button>

        <button type="button" data-summary="payment">
          <strong id="s-payment">0</strong>
          <span>A aguardar pagamento</span>
        </button>

        <button type="button" data-summary="preparing">
          <strong id="s-preparing">0</strong>
          <span>Em preparação</span>
        </button>

        <button type="button" data-summary="ready">
          <strong id="s-ready">0</strong>
          <span>Prontos</span>
        </button>

        <button type="button" data-summary="issue">
          <strong id="s-issue">0</strong>
          <span>Problemas</span>
        </button>

        <button type="button" data-summary="refund">
          <strong id="s-refund">0</strong>
          <span>Reembolsos</span>
        </button>

        <button type="button" data-summary="invoice">
          <strong id="s-invoice">0</strong>
          <span>Por faturar</span>
        </button>

        <button type="button" data-summary="credit">
          <strong id="s-credit">0</strong>
          <span>Notas de crédito</span>
        </button>
      </div>

      <div class="toolbar">
        <div class="tabs">
          <button
            type="button"
            class="tab active"
            data-view="orders"
          >
            Encomendas
          </button>

          <button
            type="button"
            class="tab"
            data-view="subscriptions"
          >
            Subscrições
          </button>

          <button
            type="button"
            class="tab"
            data-view="audit"
          >
            Histórico
          </button>

          <button
            type="button"
            class="tab"
            data-view="fiscal"
          >
            Faturação
          </button>
        </div>

        <input
          id="search"
          class="search"
          type="search"
          placeholder="Pesquisar número, nome, email ou referência AT"
        >

        <select id="state-filter">
          <option value="all">
            Todos os estados
          </option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>

        <div id="empty" class="empty hidden">
          Sem registos para mostrar.
        </div>
      </div>
    </section>
  </main>

  <div
    id="message"
    class="message hidden"
    role="status"
    aria-live="polite"
  ></div>

  <dialog id="approve-dialog">
    <form id="approve-form">
      <h2 id="approve-title">Aprovar</h2>

      <input type="hidden" name="kind">
      <input type="hidden" name="id">

      <label>
        Valor em euros

        <input
          name="amount"
          inputmode="decimal"
          required
          placeholder="12,50"
        >
      </label>

      <label id="hours-label">
        Prazo para pagar, em horas

        <input
          name="hours"
          type="number"
          value="24"
          min="1"
          max="168"
        >
      </label>

      <label>
        Local de recolha

        <input
          name="location"
          value="A combinar"
          required
        >
      </label>

      <label>
        Data prevista

        <input
          name="date"
          type="datetime-local"
        >
      </label>

      <div class="dialog-actions">
        <button
          type="button"
          class="btn secondary"
          data-close
        >
          Cancelar
        </button>

        <button class="btn">
          Aprovar e continuar
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="incident-dialog">
    <form id="incident-form">
      <h2>Reportar problema</h2>

      <p>
        Esta ação bloqueia a encomenda e pode iniciar um reembolso.
      </p>

      <input type="hidden" name="id">

      <label>
        Motivo interno

        <textarea
          name="reason"
          required
          minlength="5"
          rows="3"
        ></textarea>
      </label>

      <label>
        Nota opcional para o cliente

        <textarea
          name="customerNote"
          rows="2"
        ></textarea>
      </label>

      <label>
        Reembolso

        <select name="refundMode">
          <option value="full">Total</option>
          <option value="partial">Parcial</option>
          <option value="none">Sem reembolso</option>
        </select>
      </label>

      <label id="partial-refund" class="hidden">
        Valor parcial em euros

        <input
          name="refundAmount"
          inputmode="decimal"
        >
      </label>

      <label>
        Para confirmar, escreve
        <strong>ANULAR</strong>

        <input
          name="confirmation"
          autocomplete="off"
          required
        >
      </label>

      <div class="dialog-actions">
        <button
          type="button"
          class="btn secondary"
          data-close
        >
          Voltar
        </button>

        <button class="btn danger">
          Confirmar anulação
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="fiscal-dialog">
    <form id="fiscal-form">
      <h2 id="fiscal-title">
        Registar documento
      </h2>

      <input type="hidden" name="id">
      <input type="hidden" name="kind">

      <label id="fiscal-type-label">
        Tipo

        <select name="documentType">
          <option value="invoice_receipt">
            Fatura-recibo
          </option>

          <option value="invoice">
            Fatura
          </option>
        </select>
      </label>

      <label>
        Número do documento

        <input
          name="documentNumber"
          required
          placeholder="Ex.: FR 2026/12"
        >
      </label>

      <label>
        Data de emissão

        <input
          name="documentDate"
          type="date"
          required
        >
      </label>

      <label>
        Total em euros

        <input
          name="amount"
          inputmode="decimal"
          required
          placeholder="10,00"
        >
      </label>

      <label>
        Ligação ao documento, se existir

        <input
          name="documentUrl"
          type="url"
          placeholder="https://..."
        >
      </label>

      <label>
        Notas

        <textarea
          name="notes"
          rows="2"
        ></textarea>
      </label>

      <div class="dialog-actions">
        <button
          type="button"
          class="btn secondary"
          data-close
        >
          Voltar
        </button>

        <button class="btn">
          Registar e enviar email
        </button>
      </div>
    </form>
  </dialog>

  <script src="/admin.js?v=37"></script>
</body>
</html>
