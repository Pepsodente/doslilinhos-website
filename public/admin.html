<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestão | Dos Lilinhos</title><style>
:root{--green:#174d36;--green2:#7fc36d;--coral:#ed4d5a;--ink:#26312a;--muted:#6b756f;--line:#dfe5e1;--soft:#f5f7f5;--white:#fff;--warn:#d78b19;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#fff;border-top:8px solid var(--green2);border-bottom:1px solid var(--line)}header h1{font-size:23px;margin:0}header small{display:block;color:var(--muted)}main{max-width:1450px;margin:auto;padding:24px}.hidden{display:none!important}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.login{max-width:460px;margin:70px auto}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:8px 0 14px}.btn{border:0;border-radius:8px;background:var(--green);color:#fff;padding:10px 15px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#e8eeea;color:var(--green)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.48;cursor:wait}.top-actions{display:flex;gap:8px}.summary{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:18px}.summary button{padding:17px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer}.summary button.active{border-color:var(--green);box-shadow:0 0 0 2px #174d3620}.summary strong{display:block;font-size:27px}.summary span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.tabs{display:flex;gap:6px}.tab{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px;cursor:pointer;font-weight:800}.tab.active{background:var(--green);color:#fff}.search{flex:1;min-width:210px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1040px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{position:sticky;top:0;background:#f0f4f1;font-size:12px;text-transform:uppercase;letter-spacing:.05em}tr:hover td{background:#fafcfb}.muted{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eeea;color:var(--green);font-size:12px;font-weight:850}.badge.warn{background:#fff1d9;color:#8a5700}.badge.paid{background:#e2f5e5;color:#176329}.badge.danger{background:#fee8e6;color:#971d15}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:8px 10px;font-size:12px}.message{position:fixed;right:20px;bottom:20px;z-index:20;background:#222;color:#fff;padding:13px 17px;border-radius:9px;box-shadow:0 8px 28px #0003}.empty{text-align:center;padding:50px;color:var(--muted)}dialog{border:0;border-radius:14px;width:min(94vw,520px);padding:25px;box-shadow:0 30px 90px #0005}dialog::backdrop{background:#071810a8}dialog label{display:block;font-weight:750;margin:12px 0}dialog textarea{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:5px;resize:vertical}dialog input{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:5px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:900px){main{padding:14px}.summary{grid-template-columns:repeat(2,1fr)}header{padding:14px}.toolbar{align-items:stretch}.search{width:100%;flex-basis:100%}}
</style></head><body><header><div><h1>Gestão Dos Lilinhos</h1><small>Pedidos, pagamentos e subscrições</small></div><div class="top-actions"><button id="refresh" class="btn secondary">Atualizar</button><button id="logout" class="btn danger hidden">Sair</button></div></header><main><section id="login" class="panel login"><h2>Área administrativa</h2><form id="login-form"><label>Código administrativo<input id="token" type="password" required autofocus></label><button class="btn">Entrar</button></form></section><section id="dashboard" class="hidden"><div class="summary"><button data-summary="all" class="active"><strong id="s-all">0</strong><span>Total</span></button><button data-summary="pending"><strong id="s-pending">0</strong><span>Por aprovar</span></button><button data-summary="payment"><strong id="s-payment">0</strong><span>A aguardar pagamento</span></button><button data-summary="preparing"><strong id="s-preparing">0</strong><span>Em preparação</span></button><button data-summary="ready"><strong id="s-ready">0</strong><span>Prontos</span></button><button data-summary="issue"><strong id="s-issue">0</strong><span>Problemas</span></button><button data-summary="refund"><strong id="s-refund">0</strong><span>Reembolsos</span></button></div><div class="toolbar"><div class="tabs"><button class="tab active" data-view="orders">Encomendas</button><button class="tab" data-view="subscriptions">Subscrições</button><button class="tab" data-view="audit">Histórico</button></div><input id="search" class="search" placeholder="Pesquisar número, nome ou email"><select id="state-filter"><option value="all">Todos os estados</option></select></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty hidden">Sem registos para mostrar.</div></div></section></main><div id="message" class="message hidden"></div><dialog id="approve-dialog"><form id="approve-form"><h2 id="approve-title">Aprovar</h2><input type="hidden" name="kind"><input type="hidden" name="id"><label>Valor em euros<input name="amount" inputmode="decimal" required placeholder="12,50"></label><label id="hours-label">Prazo para pagar, em horas<input name="hours" type="number" value="24" min="1" max="168"></label><label>Local de recolha<input name="location" value="A combinar" required></label><label>Data prevista<input name="date" type="datetime-local"></label><div class="dialog-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn">Aprovar e continuar</button></div></form></dialog><dialog id="incident-dialog"><form id="incident-form"><h2>Reportar problema</h2><p>Esta ação bloqueia a encomenda e pode iniciar um reembolso.</p><input type="hidden" name="id"><label>Motivo interno<textarea name="reason" required minlength="5" rows="3"></textarea></label><label>Nota opcional para o cliente<textarea name="customerNote" rows="2"></textarea></label><label>Reembolso<select name="refundMode"><option value="full">Total</option><option value="partial">Parcial</option><option value="none">Sem reembolso</option></select></label><label id="partial-refund" class="hidden">Valor parcial em euros<input name="refundAmount" inputmode="decimal"></label><label>Para confirmar, escreve <strong>ANULAR</strong><input name="confirmation" autocomplete="off" required></label><div class="dialog-actions"><button type="button" class="btn secondary" data-close>Voltar</button><button class="btn danger">Confirmar anulação</button></div></form></dialog><script src="/admin.js?v=4"></script></body></html>
