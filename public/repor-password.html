<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definir nova palavra-passe</title><link rel="stylesheet" href="/auth-recovery.css?v=1"></head><body><main class="page"><section class="card"><p class="eyebrow">Área de cliente</p><h1>Nova palavra-passe</h1><p id="checking">A validar a ligação...</p><form id="reset" hidden><label>Nova palavra-passe<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar nova palavra-passe<input name="passwordConfirmation" type="password" minlength="8" required autocomplete="new-password"></label><button class="button">Guardar nova palavra-passe</button><p id="message" class="message" role="status"></p></form><p class="links"><a href="/?login=1">Voltar a entrar</a></p></section></main><script>const token=new URLSearchParams(location.search).get('token')||'',form=document.querySelector('#reset'),check=document.querySelector('#checking'),message=document.querySelector('#message');fetch('/api/auth/reset/validate?token='+encodeURIComponent(token)).then(r=>r.json()).then(d=>{if(d.valid){check.hidden=true;form.hidden=false}else check.textContent='Esta ligação é inválida, já foi usada ou expirou.'});form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form),b=form.querySelector('button');if(d.get('password')!==d.get('passwordConfirmation'))return message.textContent='As palavras-passe não coincidem.';b.disabled=true;const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:d.get('password'),passwordConfirmation:d.get('passwordConfirmation')})}),x=await r.json();if(r.ok){message.textContent='Palavra-passe alterada. Já podes entrar.';form.reset();setTimeout(()=>location.href='/?login=1',1500)}else{message.textContent=x.error||'Não foi possível alterar.';b.disabled=false}}</script></body></html>
